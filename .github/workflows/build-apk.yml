name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36"
          python -m pip install buildozer

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Fix requirements
        run: |
          if [ -f requirements.txt ]; then
            echo "Found requirements.txt"
            cat requirements.txt

            sed -i '/charset_normalizer.*\.whl/d' requirements.txt
            sed -i '/charset-normalizer/d' requirements.txt

            echo "charset-normalizer==2.1.1" >> requirements.txt

            echo "Fixed requirements.txt:"
            cat requirements.txt
          else
            echo "No requirements.txt found"
          fi

      - name: Install Android Command Line Tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            -O commandlinetools.zip

          rm -rf /tmp/cmdline-tools

          unzip -q commandlinetools.zip -d /tmp/cmdline-tools

          rm -rf "$SDK/cmdline-tools/latest"

          mv /tmp/cmdline-tools/cmdline-tools \
            "$SDK/cmdline-tools/latest"

          chmod +x "$SDK/cmdline-tools/latest/bin/"*

      - name: Install Android SDK packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "SDK: $SDK"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

      - name: Create Buildozer SDK compatibility path
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          echo "Checking SDK:"
          ls -la "$SDK"

          echo "Checking Build Tools:"
          ls -la "$SDK/build-tools"

          echo "Checking AIDL:"
          "$SDK/build-tools/35.0.0/aidl" --version

      - name: Build APK
        run: |
          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROIDSDK"
          export ANDROID_SDK_ROOT="$ANDROIDSDK"

          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROID_HOME=$ANDROID_HOME"

          buildozer -v android debug

      - name: Show APK files
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessManager-APK
          path: bin/*.apk
          if-no-files-found: error
