name: Build Business Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libffi-dev \
            libssl-dev

      - name: Install Python tools
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install "setuptools<81"
          python -m pip install wheel
          python -m pip install "cython==0.29.36"
          python -m pip install "buildozer==1.5.0"

      - name: Install Android SDK tools
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          mv /tmp/android-tools/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"

          export ANDROIDSDK="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/build-tools/35.0.0:$PATH"

          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

      - name: Verify AIDL
        run: |
          echo "Checking Android SDK..."
          echo "ANDROIDSDK=$ANDROIDSDK"

          find "$ANDROIDSDK" -name aidl -type f -print

          AIDL=$(find "$ANDROIDSDK" -name aidl -type f | head -n 1)

          if [ -z "$AIDL" ]; then
            echo "ERROR: AIDL was not installed."
            exit 1
          fi

          echo "AIDL FOUND:"
          "$AIDL" --version

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessManager-APK
          path: bin/*.apk
          if-no-files-found: error
