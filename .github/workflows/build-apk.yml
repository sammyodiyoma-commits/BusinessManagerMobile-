name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Accepting Android licenses..."
          yes | "$SDKMANAGER" --licenses || true

          echo "Installing Android SDK..."
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

          echo "Checking AIDL..."
          ls -la "$ANDROID_HOME/build-tools/35.0.0"
          "$ANDROID_HOME/build-tools/35.0.0/aidl" --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "Cython==0.29.36"

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Configure Buildozer SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          ln -s "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Checking SDK..."
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessManager-APK
          path: bin/*.apk
          if-no-files-found: error
