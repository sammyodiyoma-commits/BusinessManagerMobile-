name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Check Python and Java
        run: |
          python --version
          python3 --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libffi-dev \
            libssl-dev \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3" buildozer

      - name: Install Android Command Line Tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"
          cd /tmp

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          rm -rf cmdline-tools
          mkdir cmdline-tools

          unzip -q commandlinetools-linux-13114758_latest.zip \
            -d cmdline-tools

          mkdir -p "$SDK/cmdline-tools"

          rm -rf "$SDK/cmdline-tools/latest"

          mv cmdline-tools/cmdline-tools \
            "$SDK/cmdline-tools/latest"

          echo "Android command-line tools installed."

      - name: Set Android environment
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Buildozer sdkmanager compatibility path
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          echo "Checking sdkmanager:"
          ls -l "$SDK/tools/bin/sdkmanager"

          echo "Checking AIDL:"
          find "$SDK/build-tools" -name aidl -type f

      - name: Remove old Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer/android/platform/build-*

      - name: Check Buildozer configuration
        run: |
          buildozer --version
          test -f buildozer.spec
          echo "buildozer.spec found."

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_CACHE_DIR: "1"
        run: |
          buildozer android debug

      - name: List generated APK
        run: |
          echo "Generated files:"
          find bin -type f -maxdepth 1 -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessManager-APK
          path: bin/*.apk
          if-no-files-found: error
