name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev

      - name: Install Android SDK for Buildozer
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          echo "Installing Android SDK packages..."

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

          echo "Checking AIDL..."

          ls -la "$SDK/build-tools"

          find "$SDK/build-tools" -name aidl -type f -print

      - name: Set Android environment for Buildozer
        run: |
          echo "ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROIDAPI=33" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=24" >> $GITHUB_ENV

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "Cython<3"

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer

      - name: Verify Android SDK and AIDL
        run: |
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo "Build-tools:"
          find "$ANDROIDSDK/build-tools" -maxdepth 2 -type f | head -50

          echo "AIDL:"
          find "$ANDROIDSDK/build-tools" -name aidl -type f -print

          AIDL=$(find "$ANDROIDSDK/build-tools" -name aidl -type f | head -1)

          if [ -z "$AIDL" ]; then
            echo "ERROR: AIDL was not found!"
            exit 1
          fi

          chmod +x "$AIDL"

          echo "AIDL found:"
          "$AIDL" --version

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessManager-APK
          path: bin/*.apk
