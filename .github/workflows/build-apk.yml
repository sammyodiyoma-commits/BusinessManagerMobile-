name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Get project
      # --------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Python 3.11
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 4. Linux dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # --------------------------------------------------
      # 5. Python build tools
      # --------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython==0.29.36" \
            "buildozer"


      # --------------------------------------------------
      # 6. Fix charset-normalizer
      # --------------------------------------------------
      - name: Fix Python Android dependencies
        run: |
          if [ -f requirements.txt ]; then
            sed -i '/charset[-_]normalizer/d' requirements.txt
            echo "charset-normalizer==2.1.1" >> requirements.txt
          fi

          echo "requirements.txt:"
          cat requirements.txt 2>/dev/null || true


      # --------------------------------------------------
      # 7. Clean previous Buildozer files
      # --------------------------------------------------
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      # --------------------------------------------------
      # 8. Configure Buildozer Android settings
      # --------------------------------------------------
      - name: Show Buildozer configuration
        run: |
          echo "Checking buildozer.spec..."

          grep -E \
            "^(requirements|android.api|android.minapi|android.archs)" \
            buildozer.spec || true


      # --------------------------------------------------
      # 9. Build APK
      # --------------------------------------------------
      - name: Build APK
        run: |
          buildozer -v android debug


      # --------------------------------------------------
      # 10. Find APK
      # --------------------------------------------------
      - name: Find APK
        run: |
          echo "================================="
          echo "APK FILES"
          echo "================================="

          find bin \
            -type f \
            -name "*.apk" \
            -print

          echo "================================="


      # --------------------------------------------------
      # 11. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessManager-APK
          path: bin/*.apk
          if-no-files-found: error
