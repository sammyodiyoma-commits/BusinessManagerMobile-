name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36"
          python -m pip install buildozer

      - name: Install Android SDK tools
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            -O commandlinetools.zip

          rm -rf cmdline-tools
          mkdir cmdline-tools

          unzip -q commandlinetools.zip -d cmdline-tools

          rm -rf "$SDK/cmdline-tools/latest"

          mv cmdline-tools/cmdline-tools \
            "$SDK/cmdline-tools/latest"

          chmod +x "$SDK/cmdline-tools/latest/bin/"*

          echo "SDKMANAGER:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          mkdir -p "$SDK/licenses"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses

      - name: Install required Android packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;37.0.0"

          echo "===== BUILD TOOLS ====="
          ls -la "$SDK/build-tools"

          echo "===== AIDL ====="
          ls -la "$SDK/build-tools/37.0.0/aidl"

          "$SDK/build-tools/37.0.0/aidl" --version || true

      - name: Create SDK compatibility links
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          echo "===== SDK CHECK ====="
          test -d "$SDK/build-tools"
          test -f "$SDK/build-tools/37.0.0/aidl"

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          ACCEPT_EULA: "Y"
        run: |
          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROIDSDK"
          export ANDROID_SDK_ROOT="$ANDROIDSDK"

          echo "ANDROIDSDK=$ANDROIDSDK"

          echo "===== BUILD TOOLS BEFORE BUILDOZER ====="
          find "$ANDROIDSDK/build-tools" -maxdepth 2 -type f -name aidl -print

          buildozer -v android debug

      - name: Find APK
        if: success()
        run: |
          echo "===== APK ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BusinessManager-APK
          path: bin/*.apk
          if-no-files-found: error
