name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython==0.29.36"

          python -m pip install \
            "buildozer==1.5.0"

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Prepare requirements
        run: |
          if [ -f requirements.txt ]; then
            sed -i '/^[[:space:]]*charset[-_]normalizer[[:space:]]*/Id' requirements.txt
          fi

          echo "===== requirements.txt ====="

          if [ -f requirements.txt ]; then
            cat requirements.txt
          else
            echo "No requirements.txt found"
          fi

      - name: Build Android APK
        env:
          ACCEPT_EULA: "Y"
        run: |
          buildozer -v android debug

      - name: Find APK
        if: success()
        run: |
          echo "===== APK FILES ====="

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BusinessManager-APK
          path: bin/*.apk
          if-no-files-found: error
